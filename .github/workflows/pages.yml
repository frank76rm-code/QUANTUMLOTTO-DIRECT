name: Deploy QUANTUM LOTTO Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s poster.png
          echo "9484c6cb445d6142b0fa446034a4e26469a7fbe29c43485ecc82ba175d353e22  poster.png" | sha256sum -c -

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html poster.png _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
