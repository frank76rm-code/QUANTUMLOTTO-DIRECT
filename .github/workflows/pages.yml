name: Deploy QUANTUM LOTTO Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild poster
        shell: bash
        run: |
          set -euo pipefail
          cat poster-parts/part-*.txt > /tmp/poster.b64
          base64 --decode /tmp/poster.b64 > poster.webp
          echo "0824f45b11ee7c564a29502e61fef86ea0a2d5ad78ab934c961502c30f6f12bf  poster.webp" | sha256sum -c -

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html poster.webp _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/poster.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
