name: Prepare QUANTUM LOTTO 3.6.3 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          Release pubblica dell'APK Android QUANTUM LOTTO 3.6.3 per distribuzione diretta.

          File APK atteso:
          `Quantum-Lotto-v3.6.3-COMMERCIAL-release.apk`

          SHA-256 APK:
          `8019ba7bbebf1933553b5ccf0e72830fa0344402d16eb3dd79453dc6c617d246`

          Novità principali: selezione periodo analisi con date italiane e licenze con scadenza esatta a data/ora italiana.

          QUANTUM LOTTO è uno strumento di analisi matematica e statistica per Lotto e 10eLotto. Non garantisce vincite.
          EOF
          )
          if gh release view v3.6.3-direct --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v3.6.3-direct \
              --repo "$GITHUB_REPOSITORY" \
              --title "QUANTUM LOTTO 3.6.3" \
              --notes "$NOTES"
          else
            gh release create v3.6.3-direct \
              --repo "$GITHUB_REPOSITORY" \
              --title "QUANTUM LOTTO 3.6.3" \
              --notes "$NOTES"
          fi
